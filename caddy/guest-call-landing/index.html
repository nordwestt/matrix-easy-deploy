<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join a meeting</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0f1117;
        color: #e8eaed;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #b8bcc4;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Join your meeting</h1>
      <p>
        Open the meeting link you received to join the call. You do not need a
        Matrix account or password.
      </p>
    </main>
  </body>
</html>
