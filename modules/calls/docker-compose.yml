# Compose env: modules/calls/.env is symlinked to ../../.env by apply.sh.
services:
  coturn:
    image: coturn/coturn:latest
    container_name: matrix_coturn
    restart: unless-stopped
    # host networking is required so coturn can bind UDP relay ports directly
    # and report the correct external IP to WebRTC clients.
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  livekit:
    image: livekit/livekit-server:latest
    container_name: matrix_livekit
    restart: unless-stopped
    # Host networking binds WebRTC UDP ports on the host directly (no per-port
    # docker-proxy processes). Caddy reaches the API on host.docker.internal:7880.
    network_mode: host
    command: --config /livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/livekit.yaml:ro

  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    container_name: matrix_lk_jwt_service
    restart: unless-stopped
    environment:
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}/livekit/sfu
      LIVEKIT_KEY: ${LIVEKIT_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET}
      LIVEKIT_FULL_ACCESS_HOMESERVERS: ${LIVEKIT_FULL_ACCESS_HOMESERVERS}
      LIVEKIT_CS_API_URL_OVERRIDES: ${LIVEKIT_CS_API_URL_OVERRIDES}
    extra_hosts:
      "${SERVER_NAME}": "host-gateway"
      "${MATRIX_DOMAIN}": "host-gateway"
    depends_on:
      - livekit
    networks:
      - caddy_net

  guest-tuwunel:
    image: ghcr.io/matrix-construct/tuwunel:latest
    container_name: matrix_guest_tuwunel
    profiles:
      - guest-calls
    restart: unless-stopped
    volumes:
      - ./guest/tuwunel_data:/data
      - ./guest/tuwunel.toml:/tuwunel.toml:ro
    command: ["--config", "/tuwunel.toml"]
    networks:
      - caddy_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8008/_matrix/client/versions >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8008/_matrix/client/versions >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  element-call:
    image: ghcr.io/element-hq/element-call:v0.21.0
    container_name: matrix_element_call
    profiles:
      - guest-calls
    restart: unless-stopped
    volumes:
      - ./guest/element-call.config.json:/app/config.json:ro
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
    name: caddy_net
